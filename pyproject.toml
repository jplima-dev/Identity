[project]
name = "identity"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jplima-dev", email = "jp.lima.tech@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.4",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pymysql>=1.2.4",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.4",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
identity = "identity:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
